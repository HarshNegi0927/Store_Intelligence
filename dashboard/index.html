<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Intelligence Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, #141829 0%, #1f2642 100%);
            border-bottom: 1px solid rgba(108, 99, 255, 0.1);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6c63ff 0%, #5a4fff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 2px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(62, 207, 142, 0.1), rgba(62, 207, 142, 0.05));
            border: 1px solid rgba(62, 207, 142, 0.3);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 13px;
            color: #3ecf8e;
            font-weight: 500;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #3ecf8e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px rgba(62, 207, 142, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .container {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .store-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .store-selector label {
            font-size: 14px;
            color: #a0aec0;
            font-weight: 500;
        }

        .store-selector select {
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(108, 99, 255, 0.2);
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .store-selector select:hover {
            border-color: rgba(108, 99, 255, 0.4);
            background: rgba(26, 26, 46, 0.8);
        }

        .last-updated {
            margin-left: auto;
            font-size: 13px;
            color: #718096;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.8), rgba(31, 38, 66, 0.6));
            border: 1px solid rgba(108, 99, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(108, 99, 255, 0.3), transparent);
        }

        .kpi-card:hover {
            border-color: rgba(108, 99, 255, 0.4);
            background: linear-gradient(135deg, rgba(26, 26, 46, 1), rgba(31, 38, 66, 0.8));
            box-shadow: 0 12px 32px rgba(108, 99, 255, 0.15);
            transform: translateY(-4px);
        }

        .kpi-label {
            font-size: 11px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .kpi-sub {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 8px;
        }

        .kpi-icon {
            font-size: 32px;
            margin-bottom: 16px;
            display: inline-block;
        }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.8), rgba(31, 38, 66, 0.6));
            border: 1px solid rgba(108, 99, 255, 0.15);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(108, 99, 255, 0.3), transparent);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            text-transform: none;
            letter-spacing: 0;
            margin-bottom: 20px;
        }

        /* Funnel */
        .funnel-stage {
            margin-bottom: 16px;
        }

        .funnel-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .funnel-name {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .funnel-count {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .funnel-bar-bg {
            background: rgba(15, 15, 19, 0.5);
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            border: 1px solid rgba(108, 99, 255, 0.1);
        }

        .funnel-bar {
            height: 100%;
            border-radius: 8px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(108, 99, 255, 0.3);
        }

        .funnel-dropoff {
            font-size: 11px;
            color: #f87171;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Heatmap */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .heatmap-zone {
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            cursor: default;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(108, 99, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .heatmap-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
            border-radius: 12px;
        }

        .heatmap-zone:hover {
            transform: translateY(-4px);
            border-color: rgba(108, 99, 255, 0.4);
        }

        .heatmap-zone-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .heatmap-zone-score {
            font-size: 24px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .heatmap-zone-label {
            font-size: 11px;
            opacity: 0.75;
            margin-top: 4px;
            color: #a0aec0;
        }

        /* Anomalies */
        .anomaly-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            background: rgba(15, 15, 19, 0.5);
            border: 1px solid rgba(108, 99, 255, 0.1);
            transition: all 0.3s ease;
        }

        .anomaly-item:hover {
            border-color: rgba(108, 99, 255, 0.2);
            background: rgba(15, 15, 19, 0.7);
        }

        .anomaly-icon {
            font-size: 22px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .anomaly-type {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .anomaly-message {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .anomaly-action {
            font-size: 12px;
            color: #818cf8;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .anomaly-action:hover {
            color: #a5b4fc;
        }

        .severity-CRITICAL { color: #f87171; }
        .severity-WARN { color: #fbbf24; }
        .severity-INFO { color: #86efac; }

        /* Dwell Chart */
        .dwell-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .dwell-zone {
            font-size: 13px;
            color: #a0aec0;
            width: 130px;
            flex-shrink: 0;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            font-weight: 500;
        }

        .dwell-bar-bg {
            flex: 1;
            background: rgba(15, 15, 19, 0.5);
            border-radius: 8px;
            height: 24px;
            overflow: hidden;
            border: 1px solid rgba(108, 99, 255, 0.1);
        }

        .dwell-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c63ff, #5a4fff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(108, 99, 255, 0.3);
            position: relative;
        }

        .dwell-value {
            font-size: 12px;
            color: #fff;
            white-space: nowrap;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: #718096;
            font-size: 14px;
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-grid,
            .bottom-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            .header {
                padding: 16px 20px;
            }
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-left {
                justify-content: center;
                width: 100%;
            }

            .live-badge {
                width: 100%;
                justify-content: center;
            }

            .container {
                padding: 16px;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .last-updated {
                margin-left: 0;
                margin-top: 12px;
                width: 100%;
            }

            .store-selector {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 18px;
            }

            .kpi-value {
                font-size: 28px;
            }
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #050810 0%, #0f1420 100%);
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card, .kpi-card {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API = "http://localhost:8000";
        const STORE_ID = "STORE_BLR_001";
        const REFRESH_INTERVAL = 5000;

        // ── Helpers ──────────────────────────────────────
        const fetchData = async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        };

        const getHeatColor = (score) => {
            if (score >= 75) return { bg: "rgba(239,68,68,0.2)", border: "rgba(239,68,68,0.5)", text: "#ef4444" };
            if (score >= 50) return { bg: "rgba(245,158,11,0.2)", border: "rgba(245,158,11,0.5)", text: "#f59e0b" };
            if (score >= 25) return { bg: "rgba(108,99,255,0.2)", border: "rgba(108,99,255,0.5)", text: "#6c63ff" };
            return { bg: "rgba(30,30,50,0.5)", border: "rgba(60,60,90,0.5)", text: "#64748b" };
        };

        const funnelColors = ["#6c63ff", "#3b82f6", "#3ecf8e", "#f59e0b"];

        // ── Main App ──────────────────────────────────────
        function App() {
            const [metrics, setMetrics] = React.useState(null);
            const [funnel, setFunnel] = React.useState(null);
            const [heatmap, setHeatmap] = React.useState(null);
            const [anomalies, setAnomalies] = React.useState(null);
            const [health, setHealth] = React.useState(null);
            const [lastUpdated, setLastUpdated] = React.useState(null);
            const [error, setError] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            const fetchAll = async () => {
                try {
                    const [m, f, h, a, he] = await Promise.all([
                        fetchData(`${API}/stores/${STORE_ID}/metrics`),
                        fetchData(`${API}/stores/${STORE_ID}/funnel`),
                        fetchData(`${API}/stores/${STORE_ID}/heatmap`),
                        fetchData(`${API}/stores/${STORE_ID}/anomalies`),
                        fetchData(`${API}/health`),
                    ]);
                    setMetrics(m);
                    setFunnel(f);
                    setHeatmap(h);
                    setAnomalies(a);
                    setHealth(he);
                    setLastUpdated(new Date().toLocaleTimeString());
                    setError(null);
                    setLoading(false);
                } catch (err) {
                    setError("API se connect nahi ho pa raha — kya API chal rahi hai?");
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                fetchAll();
                const interval = setInterval(fetchAll, REFRESH_INTERVAL);
                return () => clearInterval(interval);
            }, []);

            if (loading) return (
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:"16px"}}>
                    <div style={{fontSize:"32px"}}>⚡</div>
                    <div style={{color:"#94a3b8"}}>Loading Store Intelligence...</div>
                </div>
            );

            const maxDwell = metrics?.avg_dwell_per_zone
                ? Math.max(...Object.values(metrics.avg_dwell_per_zone), 1)
                : 1;

            return (
                <div>
                    {/* Header */}
                    <div className="header">
                        <div className="header-left">
                            <div className="logo">🏪</div>
                            <div>
                                <h1>Store Intelligence</h1>
                                <p>Brigade Road, Bangalore — {STORE_ID}</p>
                            </div>
                        </div>
                        <div className="live-badge">
                            <div className="live-dot"></div>
                            LIVE — refreshing every 5s
                        </div>
                    </div>

                    <div className="container">
                        <div className="last-updated" style={{marginBottom:"16px"}}>
                            {error
                                ? <span style={{color:"#ef4444"}}>⚠️ {error}</span>
                                : `Last updated: ${lastUpdated}`
                            }
                        </div>

                        {/* KPI Cards */}
                        <div className="kpi-grid">
                            <div className="kpi-card">
                                <div className="kpi-icon">👥</div>
                                <div className="kpi-label">Unique Visitors</div>
                                <div className="kpi-value">{metrics?.unique_visitors ?? 0}</div>
                                <div className="kpi-sub">Today</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-icon">💰</div>
                                <div className="kpi-label">Conversion Rate</div>
                                <div className="kpi-value" style={{color: metrics?.conversion_rate > 50 ? "#3ecf8e" : "#f59e0b"}}>
                                    {metrics?.conversion_rate ?? 0}%
                                </div>
                                <div className="kpi-sub">{metrics?.converted_visitors ?? 0} purchased</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-icon">🛒</div>
                                <div className="kpi-label">Queue Depth</div>
                                <div className="kpi-value" style={{color: (metrics?.queue_depth ?? 0) > 3 ? "#ef4444" : "#3ecf8e"}}>
                                    {metrics?.queue_depth ?? 0}
                                </div>
                                <div className="kpi-sub">At billing counter</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-icon">🚪</div>
                                <div className="kpi-label">Abandonment Rate</div>
                                <div className="kpi-value" style={{color: (metrics?.abandonment_rate ?? 0) > 20 ? "#ef4444" : "#3ecf8e"}}>
                                    {metrics?.abandonment_rate ?? 0}%
                                </div>
                                <div className="kpi-sub">Left billing queue</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-icon">🏥</div>
                                <div className="kpi-label">API Health</div>
                                <div className="kpi-value" style={{fontSize:"20px", color: health?.status === "healthy" ? "#3ecf8e" : "#ef4444"}}>
                                    {health?.status === "healthy" ? "✅ Healthy" : "❌ Unhealthy"}
                                </div>
                                <div className="kpi-sub">{health?.overall_feed_status ?? "Unknown"}</div>
                            </div>
                        </div>

                        {/* Main Grid */}
                        <div className="main-grid">
                            {/* Funnel */}
                            <div className="card">
                                <div className="card-title">📊 Conversion Funnel</div>
                                {funnel?.funnel?.map((stage, i) => {
                                    const maxCount = funnel.funnel[0]?.count || 1;
                                    const pct = Math.round((stage.count / maxCount) * 100);
                                    return (
                                        <div key={i} className="funnel-stage">
                                            <div className="funnel-header">
                                                <span className="funnel-name">{stage.stage}</span>
                                                <span className="funnel-count">{stage.count}</span>
                                            </div>
                                            <div className="funnel-bar-bg">
                                                <div
                                                    className="funnel-bar"
                                                    style={{
                                                        width: `${pct}%`,
                                                        background: funnelColors[i]
                                                    }}
                                                />
                                            </div>
                                            {stage.dropoff_pct > 0 && (
                                                <div className="funnel-dropoff">
                                                    ↓ {stage.dropoff_pct}% dropped off
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                                <div style={{marginTop:"12px", paddingTop:"12px", borderTop:"1px solid #2d2d44"}}>
                                    <span style={{fontSize:"12px", color:"#94a3b8"}}>Overall conversion: </span>
                                    <span style={{fontSize:"14px", fontWeight:"600", color:"#3ecf8e"}}>
                                        {funnel?.summary?.overall_conversion_pct ?? 0}%
                                    </span>
                                </div>
                            </div>

                            {/* Dwell Time */}
                            <div className="card">
                                <div className="card-title">⏱️ Avg Dwell Time per Zone</div>
                                {metrics?.avg_dwell_per_zone && Object.keys(metrics.avg_dwell_per_zone).length > 0
                                    ? Object.entries(metrics.avg_dwell_per_zone).map(([zone, secs]) => (
                                        <div key={zone} className="dwell-bar">
                                            <div className="dwell-zone">{zone.replace(/_/g, " ")}</div>
                                            <div className="dwell-bar-bg">
                                                <div
                                                    className="dwell-bar-fill"
                                                    style={{width: `${Math.round((secs / maxDwell) * 100)}%`}}
                                                >
                                                    <span className="dwell-value">{secs}s</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                    : <div className="loading">No dwell data yet</div>
                                }
                            </div>
                        </div>

                        {/* Bottom Grid */}
                        <div className="bottom-grid">
                            {/* Heatmap */}
                            <div className="card">
                                <div className="card-title">🔥 Zone Heatmap</div>
                                <div style={{marginBottom:"8px", fontSize:"12px", color:"#64748b"}}>
                                    Confidence: {heatmap?.data_confidence ?? "—"}
                                    {heatmap?.data_confidence === "LOW" && " ⚠️ (less than 20 sessions)"}
                                </div>
                                {heatmap?.heatmap?.length > 0
                                    ? (
                                        <div className="heatmap-grid">
                                            {heatmap.heatmap.map(zone => {
                                                const colors = getHeatColor(zone.score);
                                                return (
                                                    <div
                                                        key={zone.zone_id}
                                                        className="heatmap-zone"
                                                        style={{
                                                            background: colors.bg,
                                                            border: `1px solid ${colors.border}`
                                                        }}
                                                    >
                                                        <div className="heatmap-zone-name" style={{color: colors.text}}>
                                                            {zone.zone_id.replace(/_/g, " ")}
                                                        </div>
                                                        <div className="heatmap-zone-score" style={{color: colors.text}}>
                                                            {zone.score}
                                                        </div>
                                                        <div className="heatmap-zone-label" style={{color: colors.text}}>
                                                            {zone.label}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )
                                    : <div className="loading">No heatmap data yet</div>
                                }
                            </div>

                            {/* Anomalies */}
                            <div className="card">
                                <div className="card-title">🚨 Active Anomalies</div>
                                {anomalies?.anomalies?.map((a, i) => {
                                    const icons = {
                                        BILLING_QUEUE_SPIKE: "🛒",
                                        CONVERSION_DROP: "📉",
                                        DEAD_ZONE: "💀",
                                        ALL_CLEAR: "✅"
                                    };
                                    return (
                                        <div key={i} className="anomaly-item">
                                            <div className="anomaly-icon">{icons[a.type] ?? "⚠️"}</div>
                                            <div>
                                                <div className={`anomaly-type severity-${a.severity}`}>
                                                    {a.type} — {a.severity}
                                                </div>
                                                <div className="anomaly-message">{a.message}</div>
                                                <div className="anomaly-action">💡 {a.suggested_action}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
